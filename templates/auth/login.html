{% extends "base.html" %}

{% block title %}Login - OPIc Practice Portal{% endblock %}

{% block content %}
<div class="login-page">
    <!-- Background decoration -->
    <div class="login-bg-decoration">
        <div class="decoration-circle decoration-1"></div>
        <div class="decoration-circle decoration-2"></div>
        <div class="decoration-circle decoration-3"></div>
    </div>

    <div class="container py-4 py-md-5 px-3">
        <div class="row justify-content-center align-items-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
                <div class="login-card">
                    <!-- Header -->
                    <div class="login-header text-center">
                        <div class="login-icon-wrapper">
                            <i class="fas fa-microphone-alt"></i>
                        </div>
                        <h2 class="login-title">Welcome Back</h2>
                        <p class="login-subtitle">Sign in to continue practicing for your OPIc exam</p>
                    </div>

                    <!-- Form -->
                    <form method="POST" id="loginForm" data-has-inline-loader="true" class="login-form">
                        <div class="form-group">
                            <label for="username" class="form-label">Username</label>
                            <div class="input-wrapper">
                                <span class="input-icon">
                                    <i class="fas fa-user"></i>
                                </span>
                                <input type="text" class="form-control" id="username" name="username"
                                    placeholder="Enter your username" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <label for="password" class="form-label mb-0">Password</label>
                                <a href="#" class="forgot-link">Forgot password?</a>
                            </div>
                            <div class="input-wrapper">
                                <span class="input-icon">
                                    <i class="fas fa-lock"></i>
                                </span>
                                <input type="password" class="form-control" id="password" name="password"
                                    placeholder="••••••••" required>
                                <button class="password-toggle" type="button" id="toggle-password"
                                    title="Show/Hide Password">
                                    <i class="fas fa-eye" id="password-eye"></i>
                                </button>
                            </div>
                        </div>

                        <div class="form-check-custom">
                            <input type="checkbox" id="remember" name="remember" checked>
                            <label for="remember">Keep me logged in</label>
                        </div>

                        <button type="submit" class="btn-login" id="loginBtn">
                            <i class="fas fa-sign-in-alt me-2"></i>
                            <span id="loginBtnText">Sign In</span>
                        </button>
                    </form>

                    <!-- Divider -->
                    <div class="login-divider">
                        <span>or</span>
                    </div>

                    <!-- Footer -->
                    <div class="login-footer">
                        <p>Don't have an account?
                            <a href="{{ url_for('auth.register') }}">Sign up now</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const passwordInput = document.getElementById('password');
        const togglePassword = document.getElementById('toggle-password');
        const passwordEye = document.getElementById('password-eye');
        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const loginBtnText = document.getElementById('loginBtnText');
        let isSubmitting = false;

        togglePassword.addEventListener('click', function () {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);

            if (type === 'text') {
                passwordEye.classList.remove('fa-eye');
                passwordEye.classList.add('fa-eye-slash');
            } else {
                passwordEye.classList.remove('fa-eye-slash');
                passwordEye.classList.add('fa-eye');
            }
        });

        loginForm.addEventListener('submit', function (e) {
            if (isSubmitting) {
                e.preventDefault();
                return false;
            }

            isSubmitting = true;
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Signing In...';
        });
    });
</script>

<style>
    /* Login Page Container */
    .login-page {
        min-height: calc(100vh - 60px);
        display: flex;
        align-items: center;
        position: relative;
        overflow: hidden;
        padding-bottom: 2rem;
    }

    /* Background Decorations */
    .login-bg-decoration {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        overflow: hidden;
    }

    .decoration-circle {
        position: absolute;
        border-radius: 50%;
        filter: blur(80px);
    }

    .decoration-1 {
        width: 400px;
        height: 400px;
        background: linear-gradient(135deg, rgba(59, 130, 246, 0.15) 0%, rgba(99, 102, 241, 0.1) 100%);
        top: -10%;
        left: -5%;
    }

    .decoration-2 {
        width: 500px;
        height: 500px;
        background: linear-gradient(135deg, rgba(139, 92, 246, 0.1) 0%, rgba(59, 130, 246, 0.08) 100%);
        bottom: -15%;
        right: -10%;
    }

    .decoration-3 {
        width: 300px;
        height: 300px;
        background: linear-gradient(135deg, rgba(236, 72, 153, 0.08) 0%, rgba(139, 92, 246, 0.06) 100%);
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
    }

    [data-theme="dark"] .decoration-1 {
        background: linear-gradient(135deg, rgba(59, 130, 246, 0.2) 0%, rgba(99, 102, 241, 0.15) 100%);
    }

    [data-theme="dark"] .decoration-2 {
        background: linear-gradient(135deg, rgba(139, 92, 246, 0.15) 0%, rgba(59, 130, 246, 0.12) 100%);
    }

    [data-theme="dark"] .decoration-3 {
        background: linear-gradient(135deg, rgba(236, 72, 153, 0.12) 0%, rgba(139, 92, 246, 0.1) 100%);
    }

    /* Login Card */
    .login-card {
        position: relative;
        z-index: 1;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-radius: 24px;
        padding: 2.5rem;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1),
            0 0 0 1px rgba(0, 0, 0, 0.05);
    }

    [data-theme="dark"] .login-card {
        background: rgba(30, 41, 59, 0.95);
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4),
            0 0 0 1px rgba(59, 130, 246, 0.1);
    }

    /* Login Header */
    .login-header {
        margin-bottom: 2rem;
    }

    .login-icon-wrapper {
        width: 64px;
        height: 64px;
        border-radius: 16px;
        background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 1.25rem;
        box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.4);
    }

    .login-icon-wrapper i {
        font-size: 1.75rem;
        color: white;
    }

    .login-title {
        font-size: 1.75rem;
        font-weight: 700;
        color: #1e293b;
        margin-bottom: 0.5rem;
    }

    [data-theme="dark"] .login-title {
        color: #f1f5f9;
    }

    .login-subtitle {
        color: #64748b;
        font-size: 0.9rem;
        margin-bottom: 0;
    }

    [data-theme="dark"] .login-subtitle {
        color: #94a3b8;
    }

    /* Form Styles */
    .login-form {
        display: flex;
        flex-direction: column;
        gap: 1.25rem;
    }

    .form-group .form-label {
        display: block;
        font-size: 0.875rem;
        font-weight: 600;
        color: #374151;
        margin-bottom: 0.5rem;
    }

    [data-theme="dark"] .form-group .form-label {
        color: #e2e8f0;
    }

    .input-wrapper {
        position: relative;
        display: flex;
        align-items: center;
    }

    .input-icon {
        position: absolute;
        left: 1rem;
        color: #9ca3af;
        font-size: 0.9rem;
        z-index: 1;
        pointer-events: none;
        transition: color 0.2s ease;
    }

    .input-wrapper:focus-within .input-icon {
        color: #3b82f6;
    }

    .login-form .form-control {
        width: 100%;
        padding: 0.75rem 1rem 0.75rem 2.75rem;
        border: 1.5px solid #e2e8f0;
        border-radius: 12px;
        background: #f8fafc;
        font-size: 0.9rem;
        color: #1e293b;
        transition: all 0.2s ease;
    }

    .login-form .form-control::placeholder {
        color: #9ca3af;
    }

    .login-form .form-control:focus {
        outline: none;
        border-color: #3b82f6;
        background: white;
        box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
    }

    [data-theme="dark"] .login-form .form-control {
        background: #1e293b;
        border-color: #334155;
        color: #f1f5f9;
    }

    [data-theme="dark"] .login-form .form-control:focus {
        background: #0f172a;
        border-color: #3b82f6;
        box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
    }

    .password-toggle {
        position: absolute;
        right: 0.75rem;
        background: none;
        border: none;
        color: #9ca3af;
        padding: 0.5rem;
        cursor: pointer;
        transition: color 0.2s ease;
    }

    .password-toggle:hover {
        color: #6b7280;
    }

    [data-theme="dark"] .password-toggle:hover {
        color: #e2e8f0;
    }

    .forgot-link {
        font-size: 0.8rem;
        font-weight: 500;
        color: #3b82f6;
        text-decoration: none;
        transition: color 0.2s ease;
    }

    .forgot-link:hover {
        color: #2563eb;
        text-decoration: underline;
    }

    /* Custom Checkbox */
    .form-check-custom {
        display: flex;
        align-items: center;
        gap: 0.5rem;
    }

    .form-check-custom input[type="checkbox"] {
        width: 18px;
        height: 18px;
        border-radius: 6px;
        border: 1.5px solid #d1d5db;
        background: white;
        cursor: pointer;
        accent-color: #3b82f6;
    }

    [data-theme="dark"] .form-check-custom input[type="checkbox"] {
        background: #1e293b;
        border-color: #475569;
    }

    .form-check-custom label {
        font-size: 0.875rem;
        color: #6b7280;
        cursor: pointer;
        user-select: none;
    }

    [data-theme="dark"] .form-check-custom label {
        color: #94a3b8;
    }

    /* Login Button */
    .btn-login {
        width: 100%;
        padding: 0.875rem 1.5rem;
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
        color: white;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        transition: all 0.2s ease;
        box-shadow: 0 4px 15px -3px rgba(59, 130, 246, 0.4);
        margin-top: 0.5rem;
    }

    .btn-login:hover:not(:disabled) {
        background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
        transform: translateY(-1px);
        box-shadow: 0 8px 25px -5px rgba(59, 130, 246, 0.5);
    }

    .btn-login:active:not(:disabled) {
        transform: translateY(0);
    }

    .btn-login:disabled {
        opacity: 0.7;
        cursor: not-allowed;
    }

    /* Divider */
    .login-divider {
        position: relative;
        text-align: center;
        margin: 1.5rem 0;
    }

    .login-divider::before {
        content: '';
        position: absolute;
        top: 50%;
        left: 0;
        right: 0;
        height: 1px;
        background: #e2e8f0;
    }

    [data-theme="dark"] .login-divider::before {
        background: #334155;
    }

    .login-divider span {
        position: relative;
        background: rgba(255, 255, 255, 0.95);
        padding: 0 1rem;
        color: #9ca3af;
        font-size: 0.875rem;
    }

    [data-theme="dark"] .login-divider span {
        background: rgba(30, 41, 59, 0.95);
        color: #64748b;
    }

    /* Footer */
    .login-footer {
        text-align: center;
    }

    .login-footer p {
        font-size: 0.9rem;
        color: #6b7280;
        margin-bottom: 0;
    }

    [data-theme="dark"] .login-footer p {
        color: #94a3b8;
    }

    .login-footer a {
        font-weight: 600;
        color: #3b82f6;
        text-decoration: none;
        transition: color 0.2s ease;
    }

    .login-footer a:hover {
        color: #2563eb;
        text-decoration: underline;
    }

    /* Responsive */
    @media (max-width: 576px) {
        .login-card {
            padding: 1.75rem;
            border-radius: 20px;
        }

        .login-icon-wrapper {
            width: 56px;
            height: 56px;
        }

        .login-icon-wrapper i {
            font-size: 1.5rem;
        }

        .login-title {
            font-size: 1.5rem;
        }
    }
</style>
{% endblock %}
